<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AdsGram Тест</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 32px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 320px;
        }

        h1 {
            font-size: 24px;
            color: white;
            margin-bottom: 8px;
        }

        p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-bottom: 32px;
        }

        button {
            background: linear-gradient(135deg, #00c6a7 0%, #00a884 100%);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 48px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,198,167,0.3);
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
        }

        #status {
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            word-break: break-word;
        }

        .reward-badge {
            background: rgba(255,215,0,0.2);
            border-radius: 40px;
            padding: 8px 16px;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ffd700;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reward-badge">🎁 + монеты за просмотр</div>
        <h1>Реклама</h1>
        <p>Нажми на кнопку, посмотри видео до конца и получи награду</p>
        <button id="showAdBtn">▶ Смотреть рекламу</button>
        <div id="status">📡 Загрузка SDK...</div>
    </div>

    <script>
        const blockId = "27460";
        const statusDiv = document.getElementById("status");
        const btn = document.getElementById("showAdBtn");

        let adController = null;
        let sdkReady = false;

        // Функция для обновления статуса
        function setStatus(text, isError = false) {
            statusDiv.innerHTML = text;
            if (isError) {
                statusDiv.style.color = "rgba(255,100,100,0.8)";
            } else {
                statusDiv.style.color = "rgba(255,255,255,0.5)";
            }
        }

        // Функция инициализации AdsGram
        function initAdsGram() {
            if (!window.Adsgram) {
                setStatus("❌ SDK не загрузился. Проверь интернет", true);
                btn.disabled = true;
                return false;
            }

            try {
                adController = window.Adsgram.init({
                    blockId: blockId,
                    debug: true,
                    debugConsole: true
                });
                setStatus("✅ Готово. Нажми на кнопку");
                btn.disabled = false;
                return true;
            } catch (error) {
                setStatus("❌ Ошибка: " + error.message, true);
                btn.disabled = true;
                return false;
            }
        }

        // Загружаем SDK динамически
        function loadSDK() {
            return new Promise((resolve, reject) => {
                if (window.Adsgram) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = 'https://adsgram.ai/js/adsgram.js';
                script.onload = () => {
                    console.log("AdsGram SDK загружен");
                    // Даем время на инициализацию
                    setTimeout(resolve, 100);
                };
                script.onerror = () => {
                    reject(new Error("Не удалось загрузить adsgram.js"));
                };
                document.head.appendChild(script);
            });
        }

        // Запуск
        async function start() {
            try {
                setStatus("📡 Загрузка SDK...");
                await loadSDK();
                initAdsGram();
            } catch (error) {
                setStatus("❌ " + error.message, true);
                btn.disabled = true;
            }
        }

        // Показ рекламы
        async function showAd() {
            if (!adController) {
                setStatus("❌ Реклама не инициализирована", true);
                return;
            }

            setStatus("⏳ Загрузка рекламы...");
            btn.disabled = true;

            try {
                const result = await adController.show();
                console.log("Результат:", result);
                setStatus("🎉 Награда выдана! +100 монет");
                
                // Визуальный эффект
                const badge = document.querySelector(".reward-badge");
                badge.style.transform = "scale(1.1)";
                badge.style.transition = "0.2s";
                setTimeout(() => {
                    badge.style.transform = "scale(1)";
                }, 300);
                
                setTimeout(() => {
                    if (adController) setStatus("⚡ Можно смотреть ещё");
                }, 2000);
            } catch (error) {
                console.warn("Ошибка или пропуск:", error);
                setStatus("⚠️ Реклама не досмотрена. Попробуй ещё");
            } finally {
                btn.disabled = false;
            }
        }

        // Вешаем обработчик
        btn.onclick = showAd;

        // Запускаем загрузку
        start();
    </script>
</body>
</html>
